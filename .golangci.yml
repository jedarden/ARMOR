version: "2"

run:
  go: "1.25"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-rules:
    - path: internal/server/handlers/
      linters:
        - govet
        - ineffassign
        - staticcheck
        - unused
      text: ""
